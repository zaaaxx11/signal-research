<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Signal Research — Free Stock Screener" />
    <meta property="og:description" content="Free stock screener, maps, charts, crypto, futures & forex — 5,576 US stocks, 83 filters." />
    <meta property="og:type" content="website" />
    <!-- The two preview tags that need an absolute URL. A build with
         VITE_PUBLIC_ORIGIN set replaces the marker below in place; with no
         origin given the document ships with no absolute URL at all, which is
         why the marker — not a host — is what lives in this file. -->
    <!-- og:origin -->
    <meta name="twitter:card" content="summary" />
    <!-- No font CDN, no analytics, no preconnect: this document makes exactly
         one kind of request, same-origin JSON under /screens /market /symbols
         /engine /health. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="shortcut icon" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=2" />
    <title>Signal Research</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
