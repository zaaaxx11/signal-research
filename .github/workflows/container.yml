name: container

# Native builders, one per architecture. QEMU is deliberately not used:
# Python 3.14's ssl module segfaults under qemu-user 8.2 on an arm64 host, and
# emulated builds are not evidence that the image runs on the target.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build one platform by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ strategy.job-index }}.txt"

      - name: Runtime smoke (amd64 only)
        if: matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load -t ztockz-engine:smoke .
          mkdir -p smoke-data
          chmod 777 smoke-data
          docker run --rm -v "$PWD/smoke-data:/data" ztockz-engine:smoke \
            python -m app.engine.bootstrap --symbols AAPL --output /data/engine-snapshot.json
          docker run -d --name ztockz-smoke -p 8080:8080 -v "$PWD/smoke-data:/data" ztockz-engine:smoke
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/engine/health -o health.json; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          document = json.load(open("health.json"))
          symbols = document["dataset"]["symbols"]
          assert symbols > 0, document
          print(f"amd64 runtime ok: {symbols} symbols")
          PY
          docker rm -f ztockz-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: merge the manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - name: Lowercase the image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch tags
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          tags=(-t "$image:sha-${GITHUB_SHA::12}" -t "$image:latest")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags+=(-t "$image:$GITHUB_REF_NAME")
          fi
          digests=()
          for file in /tmp/digests/*.txt; do
            digests+=("$image@$(cat "$file")")
          done
          printf 'Merging %s\n' "${digests[*]}"
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"

      - name: Inspect the result
        run: |
          docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:sha-${GITHUB_SHA::12}"
