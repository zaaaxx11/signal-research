[alembic]
# Alembic is the single source of the schema (05 Langkah 3, 02 §4).
# Driven programmatically by app/db.py::ensure_schema and by hand with:
#   alembic -x db=/tmp/copy.db upgrade head
script_location = alembic
prepend_sys_path = .
path_separator = os
# Only a fallback: env.py prefers ``-x db=...`` and then $MEE_DB_PATH.
sqlalchemy.url = sqlite:///mee.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
